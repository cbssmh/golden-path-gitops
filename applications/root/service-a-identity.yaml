apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a-identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: service-a-identity
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  project: golden-path-service-a-identity
  source:
    repoURL: https://github.com/cbssmh/golden-path-gitops.git
    targetRevision: v0.4.0
    path: platform/service-accounts/service-a
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
