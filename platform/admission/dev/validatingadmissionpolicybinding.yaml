apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: golden-path-deployment-contract-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: golden-path-deployment-contract-dev
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  policyName: golden-path-deployment-contract
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        golden-path.io/admission: enabled
