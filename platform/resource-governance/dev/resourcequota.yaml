apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-resource-budget
  labels:
    app.kubernetes.io/name: dev-resource-budget
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "6"
    services: "5"
    configmaps: "10"
