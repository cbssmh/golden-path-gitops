apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/instance: service-a-dev
    app.kubernetes.io/version: 0.1.0
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-a
      app.kubernetes.io/instance: service-a-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-a
        app.kubernetes.io/instance: service-a-dev
        app.kubernetes.io/version: 0.1.0
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: golden-path-platform
    spec:
      serviceAccountName: service-a
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-a
          image: ghcr.io/cbssmh/golden-path-service-a@sha256:5972389a2b99f26c89544528e4785655aaa422b54e7f0602b4a7b77a5c640916  # yamllint disable-line rule:line-length
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-a
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
