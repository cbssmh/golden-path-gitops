apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-a
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  project: golden-path-service-a
  source:
    repoURL: https://github.com/cbssmh/golden-path-gitops.git
    targetRevision: v0.3.0
    path: services/service-a/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
