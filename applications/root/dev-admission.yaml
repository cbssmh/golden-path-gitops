apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-admission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: dev-admission
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: golden-path-platform
spec:
  project: golden-path-dev-admission
  source:
    repoURL: https://github.com/cbssmh/golden-path-gitops.git
    targetRevision: v0.6.1
    path: platform/admission/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
